[project]
name = "chat-parser"
version = "0.1.0"
description = "Мониторинг Telegram-чатов оптик: сбор истории, LLM-извлечение болей и потребностей"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "asyncpg>=0.29",
    "openai>=1.60",
    "aiogram>=3.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
chat-parser = "chat_parser.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_parser"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel.force-include]
"db/schema.sql" = "chat_parser/schema.sql"
